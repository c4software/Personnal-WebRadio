<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>local-webradio</title>
    <!-- Vue est VENDU avec le paquet, pas tiré d'un CDN : la radio est un
         objet local, elle doit s'afficher sans internet. -->
    <script src="{{ url_for('static', filename='vue.global.prod.js') }}"></script>
    <style>
      :root {
        --fond: #0d1117; --carte: #161b22; --bord: #21262d;
        --texte: #e6edf3; --sourdine: #8b949e; --accent: #4493f8;
        --refus: #f85149; --accepte: #3fb950; --encore: #3fb950; --stop: #f85149;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--fond); color: var(--texte); min-height: 100dvh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex; justify-content: center;
      }
      main { width: min(40rem, 100%); padding: 1.25rem 1.25rem 7.5rem; }
      .onglets { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      .onglets button {
        flex: 1; padding: 0.6rem; border-radius: 0.6rem; border: 1px solid var(--bord);
        background: transparent; color: var(--sourdine); font-size: 1rem;
      }
      .onglets button.actif { background: var(--carte); color: var(--texte); border-color: var(--accent); }
      .nature {
        display: inline-block; text-transform: uppercase; letter-spacing: 0.2em;
        font-size: 0.7rem; color: var(--accent); border: 1px solid var(--bord);
        border-radius: 999px; padding: 0.3rem 0.8rem; margin-bottom: 1rem;
      }
      .titre { font-size: 1.9rem; line-height: 1.2; margin-bottom: 0.5rem; overflow-wrap: anywhere; }
      .artiste { color: var(--sourdine); font-size: 1.15rem; }
      .etat {
        margin-top: 1.25rem; padding: 0.8rem 1rem; border-radius: 0.6rem;
        background: var(--carte); border: 1px solid var(--bord); color: var(--sourdine);
      }
      .etat.refus { border-color: var(--refus); color: var(--texte); }
      .etat.accepte { border-color: var(--accepte); color: var(--texte); }
      .boutons {
        position: fixed; inset: auto 0 0 0; display: flex; gap: 0.75rem;
        padding: 1rem max(1.25rem, env(safe-area-inset-left)) max(1.25rem, env(safe-area-inset-bottom));
        background: linear-gradient(transparent, var(--fond) 35%);
        justify-content: center;
      }
      .boutons button {
        flex: 1; max-width: 18rem; padding: 1.1rem; font-size: 1.15rem; font-weight: 600;
        border-radius: 0.8rem; border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
      }
      .boutons button:active { background: #222831; }
      .boutons button[disabled] { opacity: 0.5; }
      .vote { background: var(--carte); border: 1px solid var(--bord); border-radius: 0.6rem;
              padding: 0.7rem 0.9rem; margin-bottom: 0.6rem; }
      .vote .cible { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.45rem; }
      .vote .qui { overflow-wrap: anywhere; }
      .vote .quoi { color: var(--sourdine); font-size: 0.8rem; white-space: nowrap; align-self: center; }
      .jauge { display: flex; height: 0.4rem; border-radius: 999px; overflow: hidden; background: var(--bord); }
      .jauge .stop { background: var(--stop); }
      .jauge .encore { background: var(--encore); }
      .scores { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sourdine); margin-top: 0.35rem; }
      .vide { color: var(--sourdine); text-align: center; padding: 2rem 0; }
      .groupe {
        font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--sourdine); margin: 1.25rem 0 0.6rem;
      }
    </style>
  </head>
  <body>
    <main id="app" v-cloak>
      <nav class="onglets">
        <button type="button" :class="{ actif: onglet === 'antenne' }" @click="onglet = 'antenne'">À l'antenne</button>
        <button type="button" :class="{ actif: onglet === 'votes' }" @click="ouvrirVotes()">Votes</button>
      </nav>

      <section v-if="onglet === 'antenne'">
        <p class="nature">[[ antenne ? antenne.kind : "—" ]]</p>
        <h1 class="titre">[[ antenne ? (antenne.title || antenne.kind) : "Rien à l'antenne" ]]</h1>
        <p class="artiste">[[ antenne ? (antenne.artist || "") : "" ]]</p>
        <p v-if="message" class="etat" :class="issue">[[ message ]]</p>
        <p v-else-if="!antenne" class="etat">Personne n'écoute : la radio ne tourne pas.</p>
      </section>

      <section v-else>
        <p v-if="votes.length === 0" class="vide">Aucun vote retenu — la radio tire sans préférence.</p>
        <template v-for="groupe in groupes" :key="groupe.scope">
          <h2 v-if="groupe.votes.length" class="groupe">[[ groupe.titre ]]</h2>
          <article v-for="vote in groupe.votes" :key="vote.scope + vote.target" class="vote">
            <div class="cible">
              <span class="qui">[[ vote.target ]]</span>
            </div>
            <div class="jauge">
              <span class="stop" :style="{ width: largeur(vote.stop) }"></span>
              <span class="encore" :style="{ width: largeur(vote.encore) }"></span>
            </div>
            <div class="scores"><span>stop [[ vote.stop ]]</span><span>encore [[ vote.encore ]]</span></div>
          </article>
        </template>
      </section>

      <div class="boutons" v-if="onglet === 'antenne'">
        <button type="button" :disabled="occupe" @click="voter(URLS.stop)">Passer</button>
        <button type="button" :disabled="occupe" @click="voter(URLS.encore)">Encore</button>
      </div>
    </main>

    <script>
      // La page ne décide de rien : elle demande à l'API et affiche ce qu'elle
      // répond — y compris le motif d'un refus (AGENTS.md §2). Les délimiteurs
      // sont [[ ]] : {{ '{{ }}' }} appartient à Jinja2.
      const URLS = {
        antenne: {{ url_antenne | tojson }},
        votes: {{ url_votes | tojson }},
        stop: {{ url_stop | tojson }},
        encore: {{ url_encore | tojson }},
      };
      const RAFRAICHISSEMENT_MS = {{ rafraichissement_ms | tojson }};

      Vue.createApp({
        delimiters: ["[[", "]]"],
        data() {
          return { onglet: "antenne", antenne: null, votes: [], message: "", issue: "", occupe: false };
        },
        computed: {
          groupes() {
            return [
              { scope: "piste", titre: "Morceaux", votes: this.votes.filter((v) => v.scope === "piste") },
              { scope: "artiste", titre: "Artistes", votes: this.votes.filter((v) => v.scope === "artiste") },
            ];
          },
        },
        methods: {
          largeur(score) {
            const total = Math.max(this.votes.reduce((m, v) => Math.max(m, v.stop + v.encore), 0), 1);
            return Math.round((score / total) * 100) + "%";
          },
          async rafraichir() {
            try {
              const reponse = await fetch(URLS.antenne, { headers: { Accept: "application/json" } });
              const donnees = await reponse.json();
              this.antenne = donnees.on_air && donnees.on_air_now ? donnees.on_air_now : null;
              if (this.issue === "") { this.message = ""; }
            } catch (erreur) {
              this.message = "L'API ne répond pas : " + erreur;
              this.issue = "refus";
            }
          },
          async chargerVotes() {
            try {
              const reponse = await fetch(URLS.votes, { headers: { Accept: "application/json" } });
              this.votes = (await reponse.json()).votes;
            } catch (erreur) {
              this.votes = [];
            }
          },
          ouvrirVotes() { this.onglet = "votes"; this.chargerVotes(); },
          async voter(url) {
            this.occupe = true;
            try {
              const reponse = await fetch(url, { method: "POST", headers: { Accept: "application/json" } });
              const donnees = await reponse.json();
              this.message = donnees.accepted ? "C'est noté." : donnees.reason;
              this.issue = donnees.accepted ? "accepte" : "refus";
            } catch (erreur) {
              this.message = "L'API ne répond pas : " + erreur;
              this.issue = "refus";
            } finally {
              this.occupe = false;
              setTimeout(() => { this.message = ""; this.issue = ""; }, 4000);
            }
          },
        },
        mounted() {
          this.rafraichir();
          setInterval(() => {
            this.rafraichir();
            if (this.onglet === "votes") { this.chargerVotes(); }
          }, RAFRAICHISSEMENT_MS);
        },
      }).mount("#app");
    </script>
  </body>
</html>
