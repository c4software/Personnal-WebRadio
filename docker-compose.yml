# Un seul service, délibérément (ARCHITECTURE.md §8.5.2).
#
# La chaîne de diffusion et le serveur web partagent la file en mémoire : les
# séparer imposerait un protocole entre eux, donc une architecture distribuée
# pour un auditeur sur un réseau local.
#
# Navidrome n'est PAS ici : il existe déjà, il appartient à l'auteur, et le
# déployer serait hors périmètre (SPECS.md §2).

services:
  radio:
    build: .
    image: local-webradio:dev
    container_name: local-webradio
    restart: unless-stopped

    # Les secrets ne sont ni dans l'image, ni dans ce fichier (SPECS.md §6.1).
    env_file: .env

    ports:
      - "8000:8000"   # le flux
      - "8080:8080"   # l'interface et l'API

    volumes:
      # Configuration et jingles en LECTURE SEULE : ce sont les fichiers de
      # l'auteur, et le conteneur n'a aucune raison de pouvoir les modifier.
      - ./webradio.toml:/etc/local-webradio/webradio.toml:ro
      - ${JINGLES:-./jingles}:/var/lib/local-webradio/jingles:ro
      # L'état survit à une reconstruction de l'image (ARCHITECTURE.md §5.1).
      - etat:/var/lib/local-webradio

    # Navidrome répond à un nom résolu par le réseau de l'HÔTE. Un conteneur ne
    # le résout pas forcément : c'est le premier cas de test au démarrage
    # (ARCHITECTURE.md §8.5.3, GOAL-011-T04).
    #
    # Constaté le 2026-08-30 : le conteneur joint bien `http://music` — le nom
    # est résolu par le réseau de l'hôte, et cela suffit sur cette machine.
    # Si ce n'était pas le cas ailleurs, décommenter :
    # extra_hosts:
    #   - "music:100.64.0.3"

    # Dix secondes suffisent à couper proprement une chaîne ffmpeg ; au-delà,
    # c'est qu'un processus ignore SIGTERM et il faut le corriger, pas allonger
    # le délai.
    stop_grace_period: 10s

    healthcheck:
      # La radio ne tourne que si quelqu'un écoute : on ne peut donc pas sonder
      # le flux. On sonde l'API, qui répond toujours.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/on-air', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  etat:
