# Deux services, délibérément (ARCHITECTURE.md §4, §8.5.2).
#
#   radio       — Python : le noyau, l'API, l'interface, et les deux routes que
#                 Liquidsoap appelle (« quoi jouer ? », « combien écoutent ? »).
#   liquidsoap  — décode, enchaîne, fond, encode et sert le flux. Il ne décide
#                 de rien : tout ce qu'il joue, il l'a demandé à `radio`.
#
# Navidrome n'est PAS ici : il existe déjà, il appartient à l'auteur, et le
# déployer serait hors périmètre (SPECS.md §2).

services:
  radio:
    image: ghcr.io/c4software/personnal-webradio:latest
    container_name: local-webradio
    restart: unless-stopped

    # Les secrets ne sont ni dans l'image, ni dans ce fichier (SPECS.md §6.1).
    env_file: .env
    environment:
      # Où ordonner un saut (GOAL-017) : la route /skip du diffuseur.
      LIQUIDSOAP_URL: http://liquidsoap:8000

    ports:
      - "8080:8080"   # l'interface et l'API

    volumes:
      # Configuration et jingles en LECTURE SEULE : ce sont les fichiers de
      # l'auteur, et le conteneur n'a aucune raison de pouvoir les modifier.
      - ./webradio.toml:/etc/local-webradio/webradio.toml:ro
      # Le MÊME chemin que dans `liquidsoap` : `radio` rend des chemins de
      # jingles, `liquidsoap` les ouvre. Le TOML doit donc déclarer
      # `folder = "/var/lib/local-webradio/jingles"`.
      - ${JINGLES:-./jingles}:/var/lib/local-webradio/jingles:ro
      # L'état survit à une reconstruction de l'image (ARCHITECTURE.md §5.1).
      - etat:/var/lib/local-webradio
      # Le FUSEAU de l'hôte : les heures du TOML sont locales (SPECS.md §6).
      # Sans lui, l'image vit en UTC et toute la grille est décalée d'une ou
      # deux heures selon la saison — constaté au premier flash (GOAL-015).
      - /etc/localtime:/etc/localtime:ro

    # Navidrome répond à un nom résolu par le réseau de l'HÔTE. Constaté le
    # 2026-08-30 : le conteneur joint bien `http://music`. Sinon, décommenter
    # (et faire de même dans `liquidsoap`, qui ouvre les mêmes URL) :
    # extra_hosts:
    #   - "music:100.64.0.3"

    stop_grace_period: 10s

    healthcheck:
      # La page AUSSI, pas seulement l'API : une image sans ses gabarits
      # rendait une 500 que la sonde ne voyait pas (GOAL-015).
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5); urllib.request.urlopen('http://localhost:8080/api/on-air', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  liquidsoap:
    # La version contre laquelle docs/liquidsoap.md a été établi. La syntaxe du
    # script change de version en version : verifier.sh le valide contre CETTE
    # image, et l'épingle ne se change qu'avec un nouveau relevé.
    image: savonet/liquidsoap:v2.3.3
    container_name: local-webradio-liquidsoap
    # Le script s'arrête de lui-même quand la radio n'a plus rien à jouer ou
    # que l'API ne répond plus (« couper en le disant », SPECS.md §5.1) ; le
    # superviseur relance alors un processus NEUF, et un auditeur qui se
    # rebranche redémarre une radio neuve (SPECS.md §4.7).
    restart: unless-stopped
    depends_on:
      radio:
        condition: service_healthy

    command: ["liquidsoap", "/etc/local-webradio/radio.liq"]

    environment:
      RADIO_API: http://radio:8080
      RADIO_PORT: "8000"
      RADIO_MOUNT: /flux
      RADIO_BITRATE: "128"
      RADIO_NAME: local-webradio

    ports:
      - "8000:8000"   # le flux : http://<la-machine>:8000/flux

    volumes:
      - ./webradio/adapters/liquidsoap/radio.liq:/etc/local-webradio/radio.liq:ro
      # Le cache des vidéos YouTube, téléchargées par `radio` : le diffuseur
      # les LIT au même chemin — c'est ce qui supprime le blanc
      # (docs/youtube.md §5). Lecture seule : il ne télécharge rien.
      - etat:/var/lib/local-webradio:ro
      - ${JINGLES:-./jingles}:/var/lib/local-webradio/jingles:ro

    # extra_hosts:
    #   - "music:100.64.0.3"

    stop_grace_period: 10s

volumes:
  etat:
