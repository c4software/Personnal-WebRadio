# La CI rejoue LA commande de vérification du dépôt — pas une variante allégée
# (AGENTS.md §5.2) — puis construit et publie l'image du service `radio`.
# Le service `liquidsoap`, lui, n'a pas d'image à construire : c'est l'image
# amont épinglée, avec notre script monté (ARCHITECTURE.md §8.5.2).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: La commande de vérification, la vraie
        run: ./verifier.sh

  image:
    # L'image ne se construit que sur du vérifié, et ne se publie que depuis
    # master — une PR construit sans publier.
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire (et publier depuis master)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # `latest` seul, à la demande de l'auteur : une radio personnelle
          # n'a qu'une version qui compte — celle qui tourne.
          tags: ghcr.io/${{ github.repository_owner }}/personnal-webradio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
