# La CI rejoue LA commande de vérification du dépôt — pas une variante allégée
# (AGENTS.md §5.2) — puis construit et publie LES DEUX images : celle du
# service `radio`, et celle du diffuseur — l'amont épinglée plus notre script.
# Les publier ensemble est tout l'objet de GOAL-053 : le script était monté
# depuis l'hôte, un montage n'a pas de version, et il a dérivé de six commits
# en silence (ARCHITECTURE.md §8.5.2).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: La commande de vérification, la vraie
        run: ./verifier.sh

  image:
    # Les images ne se construisent que sur du vérifié, et ne se publient que
    # depuis master — une PR construit sans publier.
    needs: verifier
    runs-on: ubuntu-latest
    strategy:
      # Les deux se construisent en parallèle et ne dépendent pas l'une de
      # l'autre. `fail-fast: false` : savoir laquelle casse vaut mieux que
      # d'arrêter les deux à la première.
      fail-fast: false
      matrix:
        include:
          - nom: radio
            dockerfile: Dockerfile
            image: personnal-webradio
          - nom: diffuseur
            dockerfile: Dockerfile.liquidsoap
            image: personnal-webradio-liquidsoap
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire ${{ matrix.nom }} (et publier depuis master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # `latest` seul, à la demande de l'auteur : une radio personnelle
          # n'a qu'une version qui compte — celle qui tourne.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
