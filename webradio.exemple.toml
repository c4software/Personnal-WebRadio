# Modèle de configuration — à copier en `webradio.toml`, qui n'est pas versionné.
#
# Ce fichier ne porte AUCUN secret : les identifiants Subsonic sont dans
# `.env` (SPECS.md §6.1). Un secret trouvé ici fait échouer le démarrage.

# ── Le flux servi aux auditeurs ────────────────────────────────────────────
# Il n'est plus configuré ici : c'est Liquidsoap qui encode et sert
# (ARCHITECTURE.md §4), et il lit son port, son débit et son nom dans
# l'environnement du service `liquidsoap` de docker-compose.yml
# (RADIO_PORT, RADIO_BITRATE, RADIO_NAME, RADIO_MOUNT). Le réencodage
# systématique vers un format unique reste la règle (SPECS.md §7 n°11).

# ── Le tirage ──────────────────────────────────────────────────────────────
[draw]
# Un artiste ne revient pas avant que N autres artistes soient passés.
# La fenêtre rétrécit plutôt que de bloquer sur une petite bibliothèque.
artist_gap = 5

# Pondération par les votes (SPECS.md §4.12).
# Les votes portent sur l'ARTISTE (révision du 2026-08-30, SPECS.md §7 n°16) :
# un artiste souvent passé revient moins souvent, un artiste redemandé plus. Rien n'est jamais supprimé : le plancher n'est pas zéro.
[draw.votes]
floor            = 0.25   # ×0,25 au plus bas — jamais 0
ceiling             = 4.0    # ×4 au plus haut
half_life_days      = 90     # un vote pèse moitié moins au bout de 3 mois

# ── Les jingles ────────────────────────────────────────────────────────────
[jingles]
# Les horaires vivent dans leur tiroir : hours/00h.mp3 … hours/23h.mp3.
# encore.mp3 (personnalisable ci-dessous) et les génériques restent à la
# racine — ou où leur nom le dit, sous-dossiers permis. Un jingle absent ne
# signale rien. Des variantes -a/-b/-c… d'un même nom se tirent au hasard.
# Par défaut, le dossier `jingles/` à la racine du dépôt (versionné vide).
folder = "jingles"
# Le jingle qui annonce un « encore » accepté — personnalisable (GOAL-031).
# Les jingles HORAIRES, eux, restent nommés par leur heure : 00h.mp3 … 23h.mp3.
encore = "encore.mp3"
# Un jingle horaire à plus de cette distance de son heure pleine est abandonné. 0 = jamais.
expiry_seconds = 900.0

# ── Les moments thématiques ────────────────────────────────────────────────
# En dehors de ces plages, le tirage est libre. Une plage sans musique se
# replie sur le tirage libre plutôt que de faire taire la radio.
# `intro` et `outro` : un générique d'ouverture et de fermeture, comme une
# radio classique — des noms de fichiers dans le dossier des jingles,
# optionnels. Absents, rien ne se passe et rien ne se signale.
[[bands]]
start  = "08:00"
end    = "10:00"
genres = ["Chanson française"]
intro  = "matinale-debut.mp3"
outro  = "matinale-fin.mp3"

[[bands]]
start  = "20:00"
end    = "23:00"
genres = ["Rock", "Pop"]
intro  = "soiree-debut.mp3"
outro  = "soiree-fin.mp3"

# `days` restreint une plage à certains jours ; sans lui, elle vaut tous les
# jours. Une plage qui enjambe minuit appartient au jour où elle commence :
# celle-ci couvre aussi dimanche 01 h.
[[bands]]
start  = "22:00"
end    = "02:00"
genres = ["Électro"]
days   = ["saturday"]
intro  = "nuit-electro-debut.mp3"
outro  = "nuit-electro-fin.mp3"

# Une plage peut imposer un ou des ARTISTES au lieu de genres — une heure d'un
# seul artiste, par exemple. `genres` et `artists` ne se déclarent jamais
# ensemble sur la même plage.
[[bands]]
start   = "17:00"
end     = "18:00"
artists = ["Air"]
days    = ["sunday"]
intro   = "heure-air-debut.mp3"
outro   = "heure-air-fin.mp3"

# Une plage peut enfin laisser la radio CHOISIR : `random = "genre"` ou
# `random = "artist"` dit la sorte de thème voulue, pas sa valeur. La radio tire
# dans toute la bibliothèque au début de l'occurrence et s'y tient jusqu'à la fin
# de la plage ; le samedi suivant retire. Une plage déclare exactement une des
# trois clés : `genres`, `artists` ou `random`.
[[bands]]
start  = "21:00"
end    = "23:00"
random = "artist"
days   = ["saturday"]
intro  = "mystere-debut.mp3"
outro  = "mystere-fin.mp3"

# ── L'état ─────────────────────────────────────────────────────────────────
# La SEULE chose que la radio retient entre deux démarrages : le dernier
# épisode diffusé de chaque émission. Une table, trois colonnes.
# Le perdre n'est pas une panne : la radio rediffusera une fois, puis
# reprendra son cours. Rien à sauvegarder.
[state]
database = "/var/lib/local-webradio/etat.sqlite3"
# Deux processus touchent cette base — la chaîne de diffusion et le serveur
# web. C'est le temps qu'une écriture accepte d'attendre un verrou.
timeout_seconds = 5.0

# ── L'interface et l'API ───────────────────────────────────────────────────
# Toute action de l'interface passe par l'API : aucun chemin privilégié.
[web]
address = "0.0.0.0"
# Un port DIFFÉRENT de celui du flux : ce sont deux serveurs distincts, et ils
# ne peuvent pas écouter le même. Le premier démarrage en conteneur l'a
# rappelé par un « Address already in use ».
port    = 8080
# Intervalle auquel la page redemande ce qui passe. Trop court, elle interroge
# pour rien ; trop long, un « encore » semble sans effet.
refresh_seconds = 5.0

# ── Les podcasts ───────────────────────────────────────────────────────────
# Un flux qui ne répond pas ne bloque pas la radio : l'émission est perdue et
# la musique continue. Le délai reste donc court.
[podcast]
timeout_seconds = 15.0

# ── YouTube ────────────────────────────────────────────────────────────────
# Le délai laissé à yt-dlp pour résoudre la dernière vidéo d'une chaîne.
[youtube]
timeout_seconds = 60.0

# ── Subsonic (hors identifiants, qui sont dans .env) ───────────────────────
[subsonic]
# Le tirage voit la bibliothèque entière (GOAL-039). `artist_results` ne borne
# que la recherche des pistes d'un artiste précis (encore, plage à artiste).
artist_results  = 50
timeout_seconds     = 10.0
# La bibliothèque est servie de mémoire pendant cette durée : un morceau ajouté
# sur le serveur apparaît au plus tard une heure après. 0 = sans cache.
cache_seconds   = 3600.0

# ── Les programmes ──────────────────────────────────────────────────────────
# Des jours ET des heures, et la musique vient d'une liste de lecture que vous
# avez faite dans votre bibliothèque — pas d'un genre. Un programme l'emporte sur une
# plage thématique qui le recouvre.
# Une liste introuvable, vidée ou renommée ne fait pas taire la radio : elle se
# replie sur le tirage libre et le journalise.
[[programmes]]
name      = "Le vendredi de Chloé"
playlist = "Chloé"
days    = ["friday"]
start    = "18:00"
end      = "20:00"
intro    = "chloe-debut.mp3"
outro    = "chloe-fin.mp3"

# ── Les émissions ──────────────────────────────────────────────────────────
# Autant qu'on veut, mais jamais deux à la même heure le même jour : la radio
# refuserait de démarrer en les nommant.
#
# On diffuse l'épisode `full` le plus récent qui n'a pas déjà été diffusé. Si
# le podcast n'a rien publié de neuf, la case est sautée et la radio reste sur
# la musique (SPECS.md §4.11).
[[shows]]
name   = "A la French"
feed  = "https://feeds.acast.com/public/shows/a-la-french"
days = ["friday"]
time = "20:00"

# Un DIRECT comme émission (SPECS.md §4.11, §7 n°22) : `stream` au lieu de
# `feed`, et `duration_minutes` obligatoire — un direct ne se termine pas seul.
# C'est ainsi que passe le flash France Info : le podcast des flashs n'existe
# plus, le direct répond (docs/franceinfo.md §1.bis). La grille de franceinfo —
# un journal à :00 et :30, environ neuf minutes — n'est connue que de seconde
# main : ajustez la durée à l'oreille. Pas de rattrapage : si la jonction
# arrive à 12:03, on capte jusqu'à 12:09, pas une minute de plus.
[[shows]]
name   = "Flash franceinfo"
stream = "https://icecast.radiofrance.fr/franceinfo-midfi.mp3"
duration_minutes = 13 
days = "all"
time = "11:57"

# Une CHAÎNE YOUTUBE comme émission (docs/youtube.md) : à l'heure dite, la
# dernière vidéo non encore diffusée — sinon la case est sautée. La durée se
# lit sur la vidéo, l'audio se résout par yt-dlp au moment de diffuser.
[[shows]]
name    = "Hardisk"
youtube = "https://www.youtube.com/@hardisk"
days = ["wednesday"]
time = "20:00"

[[shows]]
name   = "LEGEND"
feed  = "https://feeds.acast.com/public/shows/legend-1"
days = ["tuesday"]
time = "20:00"
