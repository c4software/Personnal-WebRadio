[project]
name = "local-webradio"
version = "0.1.0"
description = "Une station de radio personnelle qui n'existe que lorsqu'on l'écoute"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-webradio = "webradio.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webradio*"]
